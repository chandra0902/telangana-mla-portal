<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telangana MLA Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
background:
linear-gradient(rgba(241,245,249,0.92), rgba(241,245,249,0.95)),
url('images/assembly.jpg');
background-size:cover;
background-position:center;
background-attachment:fixed;
color:#0f172a
}

/* DARK MODE */
.dark{
background:#020617 !important;
color:#e2e8f0 !important;
}
.dark .navbar{background:#020617}
.dark .table-box,.dark .chart-box,.dark .feature,.dark .search-box{
background:#0f172a;color:#e2e8f0
}

/* NAVBAR */
.navbar{
background:#0f172a;color:white;padding:16px 40px;
display:flex;justify-content:space-between;align-items:center;
position:sticky;top:0;z-index:1000
}
.navbar a{color:#cbd5f5;margin-left:20px;text-decoration:none}
.navbar a:hover{color:white}

/* HERO */
.hero{
padding:80px 20px;text-align:center;
background:
linear-gradient(rgba(30,58,138,0.85), rgba(99,102,241,0.9)),
url('images/assembly.jpg');
background-size:cover;
background-position:center;
color:white
}
.hero h1{font-size:48px}
.hero button{
padding:14px 30px;border:none;border-radius:999px;
background:white;color:#1e3a8a;font-weight:600
}

/* ACTIONS */
.actions{
display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;max-width:1100px;margin:-40px auto 40px;padding:0 20px
}
.action-card{
background:white;padding:25px;border-radius:16px;text-align:center;
cursor:pointer;transition:0.3s
}
.action-card:hover{transform:translateY(-8px)}

/* STATS */
.stats{
display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;padding:20px;max-width:1100px;margin:auto
}
.stat{
padding:20px;border-radius:14px;color:white;cursor:pointer
}
.s1{background:#ef4444}
.s2{background:#3b82f6}
.s3{background:#22c55e}

/* SEARCH */
.search-box{
background:white;padding:20px;border-radius:16px;
max-width:900px;margin:20px auto;
display:flex;gap:10px
}
.search-box input{flex:1;padding:10px}

/* GRID */
.main{
display:grid;grid-template-columns:2fr 1fr;gap:20px;
max-width:1100px;margin:auto;padding:20px
}

/* TABLE */
.table-box{background:white;border-radius:16px;padding:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee}
th{background:#1e3a8a;color:white}
tr:hover{background:#f1f5f9;cursor:pointer}

/* CHART */
.chart-box{background:white;border-radius:16px;padding:15px}

/* FOOTER */
.footer{text-align:center;padding:30px;background:#0f172a;color:white;margin-top:40px}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<h2>🏛 Telangana MLA Portal</h2>
<div>
<a href="#">Home</a>
<a href="public.html">Directory</a>
<a href="analytics.html">Analytics</a>
<a href="login.html">🔐 Login</a>
<a href="#" onclick="toggleDark()">🌙</a>
</div>
</div>

<!-- HERO -->
<div class="hero">
<h1>Explore Telangana MLAs</h1>
<button onclick="goDir()">Start Exploring</button>
</div>

<!-- ACTIONS -->
<div class="actions">
<div class="action-card" onclick="goDir()">📋 Browse MLAs</div>
<div class="action-card" onclick="focusSearch()">🔍 Search MLA</div>
<div class="action-card" onclick="goDash()">📊 Analytics</div>
</div>

<!-- STATS -->
<div class="stats">
<div class="stat s1" onclick="goDir()">Total MLAs<br><b id="mlaCount">0</b></div>
<div class="stat s2" onclick="goDash()">Parties<br><b id="partyCount">0</b></div>
<div class="stat s3" onclick="goDash()">Districts<br><b id="districtCount">0</b></div>
</div>

<!-- SEARCH -->
<div class="search-box">
<input id="searchBox" placeholder="Search constituency">
<button onclick="searchMLA()">Search</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="table-box">
<h3>Top 5 MLAs</h3>
<table>
<thead>
<tr><th>Name</th><th>Party</th><th>Constituency</th><th>Rating</th></tr>
</thead>
<tbody id="mlaTable"></tbody>
</table>
</div>

<div class="chart-box">
<h3>Party Distribution</h3>
<canvas id="chart"></canvas>
</div>

</div>

<div class="footer">© Telangana MLA Portal</div>

<script>
let data=[];

function goDir(){window.location.href='public.html'}

/* ✅ FIXED HERE */
function goDash(){window.location.href='analytics.html'}

function focusSearch(){document.getElementById('searchBox').focus()}

function toggleDark(){document.body.classList.toggle('dark')}

function load(){
fetch('viewMla').then(r=>r.json()).then(d=>{
data=d;
render();
chart();
});
}

function render(){
let parties={},districts={},html='';

data.forEach(m=>{
parties[m.party]=(parties[m.party]||0)+1;
districts[m.district]=(districts[m.district]||0)+1;
});

mlaCount.innerText=data.length;
partyCount.innerText=Object.keys(parties).length;
districtCount.innerText=Object.keys(districts).length;

let sorted=[...data].sort((a,b)=> (b.rating||0)-(a.rating||0)).slice(0,5);

sorted.forEach(m=>{
html+=`<tr onclick="viewDetails(${m.id})">
<td>${m.name}</td>
<td>${m.party}</td>
<td>${m.constituency}</td>
<td>⭐ ${m.rating||0}</td>
</tr>`;
});

mlaTable.innerHTML=html;
}

function viewDetails(id){
window.location.href='mlaDetails?id='+id;
}

function chart(){
let count={};
data.forEach(m=>count[m.party]=(count[m.party]||0)+1);

new Chart(document.getElementById('chart'),{
type:'doughnut',
data:{
labels:Object.keys(count),
datasets:[{data:Object.values(count)}]
}
});
}

function searchMLA(){
let v=searchBox.value;
window.location.href='public.html?search='+encodeURIComponent(v);
}

searchBox.addEventListener('keypress',e=>{
if(e.key==='Enter') searchMLA();
});

window.onload=load;
</script>

</body>
</html>
